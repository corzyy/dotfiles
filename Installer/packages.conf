# Dynamic package lists for dotfiles installer.
# Add programs here later — one entry per line, no commas.
# Lines starting with # are ignored. Duplicates are de-duped by the installer.
#
# Usage:
#   PACMAN_PACKAGES — official repos (pacman). If a package is not found in
#                     pacman (e.g. mangowm on vanilla Arch), the installer
#                     automatically falls back to paru.
#   AUR_PACKAGES    — always installed via paru.
#
# Example — to add a new program later, just append:
#   PACMAN_PACKAGES+=(
#     neovim
#   )

PACMAN_PACKAGES=(
  # --- compositor + shell (explicit, required for mango session + sddm) ---
  mangowm
  quickshell
  swaybg

  # --- display manager ---
  sddm

  # --- terminal + system info ---
  kitty
  btop
  fastfetch
  fish

  # --- theming / gtk ---
  nwg-look
  qt6ct
  papirus-icon-theme
  adw-gtk-theme
  xdg-user-dirs

  # --- jhqs runtime deps ---
  grim
  slurp
  wl-clipboard
  brightnessctl
  playerctl
  jq
  pipewire
  wireplumber
  polkit-kde-agent

  # --- apps referenced by mango/jhqs binds ---
  nautilus

  # --- fonts ---
  ttf-jetbrains-mono-nerd
)

AUR_PACKAGES=(
  # matugen drives jhqs Theme + kitty/btop/gtk/qt theming
  matugen-bin
)
