# Package configuration for the Fedora installer (install.sh).
#
# Every entry is grouped and annotated with what needs it, so the list can be
# audited against the Umbriel + solstice stack at any time. Lines starting
# with # and blank lines are ignored, and duplicates are removed
# automatically.
#
#   BASE_PACKAGES  Bootstrap tools missing on a Fedora "Everything / Minimal"
#                  install. Keep this minimal.
#   PACKAGES       Required for the Umbriel session and the solstice shell.
#                  The installer treats these as mandatory and verifies each
#                  one after installation.
#   APP_PACKAGES   Optional applications referenced by the dotfiles/keybinds.
#                  The installer asks before installing them (--no-apps skips).
#   M3SHAPES_PACKAGES  Build dependencies for the M3Shapes QML module that
#                  solstice imports. Installed on demand by the m3shapes step.
#   ENABLE_TERRA   "true" enables the Terra repository, which provides
#                  umbriel-nightly, helium-browser-bin, nwg-look and
#                  jetbrainsmono-nerd-fonts.
#
# After editing, re-run only the affected step, e.g.:
#   ./install.sh --only-packages -y

ENABLE_TERRA="true"

BASE_PACKAGES=(
  git             # installer + solstice checkout/update
  curl            # fisher and the solstice font helpers
  rsync           # config and wallpaper copying
  xdg-user-dirs   # localized Pictures/Documents (wallpaper target)
)

PACKAGES=(
  # --- compositor + session ---
  umbriel-nightly   # Terra: Wayland compositor, ships wayland-sessions/umbriel.desktop
  sddm              # display manager that starts the Umbriel session;
                    # skipped automatically when another DM is installed
  quickshell        # shell runtime (solstice)
  swaybg            # wallpaper display (WallpaperService, wallpaper-restore.sh)

  # --- solstice runtime (backend scripts/QML) ---
  python3           # settings-apply, theming-apply, umbriel-apply, keybinds, wallpapers
  jq                # shell.qml, ThemeEngine, apply-gtk.sh, wallpaper-restore.sh
  matugen           # wallpaper-derived theming engine

  # --- audio (Quickshell Pipewire, wpctl/pactl) ---
  pipewire
  pipewire-pulseaudio
  pipewire-alsa
  wireplumber       # provides wpctl
  pulseaudio-utils  # provides pactl, used by the solstice Audio settings page

  # --- network + bluetooth services ---
  NetworkManager    # nmcli polled by NetworkService
  bluez             # BluetoothService panel/pairing (bluetoothctl)

  # --- portals + screenshot pipeline (ScreenshotUI, file dialogs) ---
  xdg-desktop-portal
  xdg-desktop-portal-wlr
  xdg-desktop-portal-gtk
  grim
  slurp
  wl-clipboard

  # --- keybind helpers (Umbriel + solstice Keybinds page) ---
  brightnessctl     # XF86MonBrightnessUp/Down
  playerctl         # XF86AudioNext/Play/Pause/Prev

  # --- theming: GTK / icons / fonts ---
  adw-gtk3-theme    # GTK theme used by apply-gtk.sh and theme presets
  papirus-icon-theme # shell.qml sets "IconTheme Papirus" (Papirus-Matugen derived)
  jetbrainsmono-nerd-fonts # Terra: Theme.iconFontFamily "JetBrainsMono Nerd Font"

  # --- terminal + shell shipped by the dotfiles ---
  kitty             # ~/.config/kitty, Mod+Return
  fish              # ~/.config/fish, fisher plugin step
)

# Optional applications. Referenced by the dotfiles/keybinds but not needed to
# boot Umbriel or run solstice; the installer asks before installing these.
APP_PACKAGES=(
  btop              # ~/.config/btop (matugen color_theme)
  fastfetch         # ~/.config/fastfetch
  nautilus          # file manager (Mod+E)
  helium-browser-bin # Terra: browser (Mod+B, default_apps.json)
  mpv               # video player
  imv               # image viewer
  nwg-look          # Terra: GTK settings GUI
  qt6ct             # Qt color scheme generated by matugen (apply-qt.sh)
)

# Build dependencies for github.com/soramanew/m3shapes (no distro package).
# Used by ./install.sh --only-m3shapes; installed automatically by the full run.
M3SHAPES_PACKAGES=(
  cmake
  ninja-build
  gcc-c++
  qt6-qtbase-devel          # Qt6Core + moc
  qt6-qtdeclarative-devel   # Qt6Qml/Qt6Quick + qmltyperegistrar
  qt6-qtshadertools-devel   # Qt6ShaderTools cmake package + qsb (qt_add_shaders)
)
