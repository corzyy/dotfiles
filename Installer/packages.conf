# Package configuration for the Fedora installer (install.sh).
#
# Add programs by appending to the arrays below — one entry per line, no
# commas. Lines starting with # and blank lines are ignored, and duplicates
# are removed automatically.
#
#   BASE_PACKAGES  Bootstrap tools installed before anything else. Keep this
#                  minimal: a Fedora "Everything / Minimal" install is missing
#                  basic tools such as git and rsync.
#   PACKAGES       The main package set, installed in a single dnf
#                  transaction.
#   ENABLE_TERRA   "true" enables the Terra repository, which provides
#                  mangowm and jetbrainsmono-nerd-fonts.
#
# After editing, re-run only the affected step, e.g.:
#   ./install.sh --only-packages -y

ENABLE_TERRA="true"

BASE_PACKAGES=(
  git
  curl
  rsync
  xdg-user-dirs
  accountsservice
)

PACKAGES=(
  # --- compositor + shell (mango session for SDDM, jhqs on quickshell) ---
  mangowm
  quickshell
  swaybg

  # --- display manager ---
  sddm

  # --- terminal + system info ---
  kitty
  btop
  fastfetch
  fish

  # --- theming: GTK / Qt / icons ---
  nwg-look
  qt6ct
  adw-gtk3-theme
  papirus-icon-theme

  # --- jhqs runtime dependencies ---
  grim
  slurp
  wl-clipboard
  brightnessctl
  playerctl
  jq
  pipewire
  pipewire-pulseaudio
  pipewire-alsa
  wireplumber
  polkit-kde

  # --- portals (screenshot / file dialogs on wlroots compositors) ---
  xdg-desktop-portal
  xdg-desktop-portal-wlr
  xdg-desktop-portal-gtk

  # --- networking ---
  NetworkManager

  # --- applications referenced by the mango/jhqs bindings ---
  nautilus

  # --- media / image viewers ---
  mpv
  imv

  # --- fonts (regular from Fedora, nerd-patched from Terra) ---
  # The nerd-patched family provides the icon glyphs used by jhqs and fastfetch.
  jetbrains-mono-fonts
  jetbrainsmono-nerd-fonts

  # --- theming engine that drives jhqs, kitty, btop, GTK and Qt ---
  matugen
)
