# Package lists for dotfiles installer (Arch/CachyOS + Fedora).
# Add programs here later — one entry per line, no commas.
# Lines starting with # are ignored. Duplicates are de-duped by the installer.
#
# Arch/CachyOS:
#   PACMAN_PACKAGES — official repos (pacman). If a package is not found in
#                     pacman (e.g. mangowm on vanilla Arch), the installer
#                     automatically falls back to paru.
#   AUR_PACKAGES    — always installed via paru.
#
# Fedora (Everything minimal install):
#   FEDORA_BASE_PACKAGES — bootstrap tools missing on a minimal install
#                          (git/curl/rsync, copr plugin, xdg-user-dirs…).
#   FEDORA_PACKAGES      — main set, installed via dnf/dnf5 in one
#                          transaction. Missing packages are skipped with a
#                          warning (fallbacks below handle quickshell/matugen).
#                          mangowm comes straight from Terra — no COPR needed.
#   COPR_REPOS           — extra COPRs, enabled via `dnf copr enable -y <repo>`
#                          before installing packages. Empty by default; add
#                          your own here if needed.
#   QUICKSHELL_COPR      — auto-enabled ONLY if `quickshell` is not found in
#                          the enabled repos (older Fedora releases).
#   MATUGEN_COPR         — auto-enabled ONLY if `matugen` is not found in
#                          the enabled repos.
#   ENABLE_TERRA         — "true" to add the Terra third-party repo
#                          (upstream-documented Fedora source for mangowm +
#                          nerd-fonts). Skipped if terra.repo already exists.
#
# Example — to add a new program later, just append:
#   PACMAN_PACKAGES+=(
#     neovim
#   )
#   FEDORA_PACKAGES+=(
#     neovim
#   )

# ---------------------------------------------------------------- Arch ---
PACMAN_PACKAGES=(
  # --- compositor + shell (explicit, required for mango session + sddm) ---
  mangowm
  quickshell
  swaybg

  # --- display manager ---
  sddm

  # --- terminal + system info ---
  kitty
  btop
  fastfetch
  fish

  # --- theming / gtk ---
  nwg-look
  qt6ct
  papirus-icon-theme
  adw-gtk-theme
  xdg-user-dirs

  # --- jhqs runtime deps ---
  grim
  slurp
  wl-clipboard
  brightnessctl
  playerctl
  jq
  pipewire
  wireplumber
  polkit-kde-agent

  # --- apps referenced by mango/jhqs binds ---
  nautilus

  # --- fonts ---
  ttf-jetbrains-mono-nerd
)

AUR_PACKAGES=(
  # matugen drives jhqs Theme + kitty/btop/gtk/qt theming
  matugen-bin
)

# --------------------------------------------------------------- Fedora ---
# mangowm lives in Terra — no COPR needed. COPR_REPOS is empty by default;
# quickshell/matugen COPRs below are fallbacks, enabled only when the
# package is missing from all enabled repos.
COPR_REPOS=(
)

QUICKSHELL_COPR="errornointernet/quickshell"
MATUGEN_COPR="solopasha/hyprland"

ENABLE_TERRA="true"

# Minimal-install bootstrap: Everything-netinstall "Minimal" ships without
# even git/curl. These are installed first so the rest can proceed.
FEDORA_BASE_PACKAGES=(
  git
  curl
  rsync
  dnf-plugins-core
  xdg-user-dirs
  accountsservice
)

FEDORA_PACKAGES=(
  # --- compositor + shell (mango session for sddm + quickshell for jhqs) ---
  # mangowm comes from Terra; quickshell from official Fedora repos
  # (fallback: QUICKSHELL_COPR above).
  mangowm
  quickshell
  swaybg

  # --- display manager ---
  sddm

  # --- terminal + system info ---
  kitty
  btop
  fastfetch
  fish

  # --- theming / gtk (nwg-look optional: skipped with warning if missing) ---
  nwg-look
  qt6ct
  papirus-icon-theme
  adw-gtk3-theme

  # --- jhqs runtime deps ---
  grim
  slurp
  wl-clipboard
  brightnessctl
  playerctl
  jq
  pipewire
  wireplumber
  pipewire-pulseaudio
  pipewire-alsa-plugins
  polkit-kde

  # --- portals for screensharing/file dialogs on wlroots compositors ---
  xdg-desktop-portal
  xdg-desktop-portal-wlr
  xdg-desktop-portal-gtk

  # --- networking (guarantee GUI-independent net on minimal installs) ---
  NetworkManager

  # --- apps referenced by mango/jhqs binds ---
  nautilus

  # --- fonts (regular from Fedora, nerd-patched from Terra) ---
  jetbrains-mono-fonts
  jetbrainsmono-nerd-fonts

  # --- jhqs theming engine (official Fedora on new releases,
  #     fallback: MATUGEN_COPR, then cargo) ---
  matugen
)
