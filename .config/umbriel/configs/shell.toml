# solstice settings — generated by Appearance > Umbriel.
# Do not edit manually; the settings app overwrites this file.

[layout]
mode = "dwindle"
gap = 10

[appearance]
border_width = 2
corner_radius = 20

[appearance.blur]
enabled = true
optimized = false

[appearance.shadow]
enabled = true

[animation]
enabled = true

[animation.windows_in]
style = "slide"
duration_ms = 360

[animation.windows_out]
style = "slide"
duration_ms = 360

[animation.windows_move]
duration_ms = 570

[animation.workspaces]
duration_ms = 420

# Shell layer override: shared cached backdrop for the bar and panels.
# Off = each surface blurs its own backdrop (may show an edge along the
# fused bar/panel joint). blur=false is written automatically while the
# shell is opaque (Transparency < 5%).
[[layer_rule]]
match.namespace = "^(bar|menu|calendar|settings|updatecenter|vitals|systemtray|launcher|networkpanel|volumepanel|bluetoothpanel|controlcenterpanel|volumeosd|notifications)$"
blur = false
blur_optimized = false
