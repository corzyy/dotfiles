# Input — ported from mango configs/input.conf plus the cursor settings from
# configs/looknfeel.conf.
# Documentation: https://docs.noctalia.dev/umbriel/input/

[input.keyboard]
layout = "de"               # mango: xkb_rules_layout=de
repeat_rate = 25
repeat_delay = 600
numlock_toggle = false      # mango: numlockon=0

[input.mouse]
natural_scroll = false      # mango: mouse_natural_scrolling=0
accel_profile = "flat"      # mango: accel_profile=0 (flat)
sensitivity = 0         # mango: mouse_accel_speed=-0.2

[input.focus]
follows_mouse = true

[input.cursor]
theme = "MacOS-Tahoe-Cursor"  # mango: cursor_theme
size = 24                     # mango: cursor_size=24
