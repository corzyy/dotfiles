# Outputs — ported from mango configs/monitors.conf.
# HDMI-A-1 left (1920x1080@60 at 0x0), DP-1 right (1920x1080@144 at 1920x0).
# NOTE: keep x/y >= 0, XWayland clicks break with negative coords.
# Documentation: https://docs.noctalia.dev/umbriel/outputs/

[output.DP-1]
enabled = true
mode = "1920x1080@144"
position = [1920, 0]
tearing = true
direct_scanout = true
workspace_axis = "vertical"
workspaces = 5

[output.HDMI-A-1]
enabled = true
mode = "1920x1080@60"
position = [0, 0]
workspace_axis = "vertical"
workspaces = 2