# Matugen generated — do not edit manually
# Source: {{image}}
# MangoWM window colors from the wallpaper palette. Sourced AFTER
# looknfeel.conf (see ~/.config/mango/config.conf), so these win.
# Applied live via post_hook: mmsg dispatch reload_config.
# NOTE: focus/border intentionally swapped vs matugen default --
# focused window gets the accent (primary), unfocused gets surface_dim.
focuscolor=0x{{colors.primary.default.hex_stripped}}ff
bordercolor=0x{{colors.surface_dim.default.hex_stripped}}ff
rootcolor=0x{{colors.background.default.hex_stripped}}ff
urgentcolor=0x{{colors.error.default.hex_stripped}}ff
# Drop preview when dragging a tiled window onto another (muted primary,
# fairly opaque since the container tone is dark)
dropcolor=0x{{colors.primary_container.default.hex_stripped}}aa
# Split indicator for manual dwindle layout
splitcolor=0x{{colors.tertiary.default.hex_stripped}}ff
