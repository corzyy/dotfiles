# More option see https://github.com/DreamMaoMao/mango/wiki/
# Mirrors hyprland config in ~/.config/hypr (binds/user.lua, binds/system.lua,
# monitors.lua, autostart.lua). Hypr-only bits noted inline in configs/.
# Split into configs/; reload with SUPER+SHIFT+R.

source=~/.config/mango/configs/looknfeel.conf
source=~/.config/mango/colors.conf
source=~/.config/mango/configs/input.conf
source=~/.config/mango/configs/monitors.conf
source=~/.config/mango/configs/autostart.conf
source=~/.config/mango/configs/workspaces.conf
source=~/.config/mango/configs/rules.conf
source=~/.config/mango/configs/binds-user.conf
source=~/.config/mango/configs/binds-system.conf
