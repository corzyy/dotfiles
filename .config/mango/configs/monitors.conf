# Monitors (from hypr configs/monitors.lua + `hyprctl monitors`)
# HDMI-A-1 left (1920x1080@60 at 0x0), DP-1 right (1920x1080@144 at 1920x0).
# NOTE: keep x/y >= 0, XWayland clicks break with negative coords.
monitorrule=name:^HDMI-A-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1
monitorrule=name:^DP-1$,width:1920,height:1080,refresh:144,x:1920,y:0,scale:1
