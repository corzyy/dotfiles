# User binds (mirrors hypr configs/binds/user.lua).
# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload mango config (moved to SHIFT: SUPER+R is jhqs reload, like hypr user.lua)
bind=SUPER+SHIFT,R,reload_config

# --- apps (launchWithOsd wrapper is hypr-specific, plain spawn here) ---
bind=SUPER,Return,spawn,kitty
bind=SUPER,E,spawn,nautilus
bind=SUPER,A,spawn,opencode
bind=SUPER,B,spawn,helium-browser
bind=SUPER,space,spawn,qs -c jhqs ipc call jhqs toggleMenu
bind=SUPER,Escape,spawn,qs -c jhqs ipc call jhqs toggleSystem


# --- jhqs IPC ---
bind=SUPER,comma,spawn,qs -c jhqs ipc call jhqs toggleSettings
bind=SUPER,S,spawn,qs -c jhqs ipc call jhqs toggleControlCenter
bind=SUPER,R,spawn,qs -c jhqs ipc call jhqs reload
bind=SUPER+CTRL+ALT,D,spawn,qs -c jhqs ipc call jhqs toggleCalendar
bindl=SUPER,L,spawn,qs -c jhqs ipc call lockscreen lock

# --- window close / float ---
# hypr: SUPER+W close, SUPER+T float toggle
bind=SUPER,W,killclient,
bind=SUPER,T,togglefloating,
bind=ALT,q,killclient,

# exit mango (no hypr equivalent)
bind=SUPER,M,quit

# --- screenshot ---
# hyprshot is Hyprland-only, so use grim+slurp on mango (needs grim/slurp/wl-clipboard).
bind=NONE,Print,spawn_shell,grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png
