# Tags/workspaces (mirrors hypr configs/workspaces.lua).
# NOTE: tag count (tag_num=10, Hypr has 10 workspaces) lives in looknfeel.conf.
# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
# dwindle,spiral,fair (+ vertical_ variants)
# Only scroller + dwindle enabled (see circle_layout in looknfeel.conf).
# Pinned like hypr workspaces.lua (ws1 DP-1, ws2 HDMI-A-1, ws3-5 DP-1,
# persistent via no_hide). Tags 6-10 unpinned.
# Every tag defaults to dwindle (tags 6-10 have no monitor pin, so plain rules).
# NOTE (mango 0.16.1): tags are per-(monitor, tag), and a tagrule with
# monitor_name only matches on that monitor. E.g. id:2 pinned to HDMI-A-1 does
# NOT match tag 2 viewed on DP-1 -> falls back to tile (master). So ids 1-5
# get extra monitor-agnostic fallback rules below; every candidate rule says
# dwindle, so the layout resolves to dwindle on any monitor.
tagrule=id:1,monitor_name:DP-1,no_hide:1,layout_name:dwindle
tagrule=id:2,monitor_name:HDMI-A-1,no_hide:1,layout_name:dwindle
tagrule=id:3,monitor_name:DP-1,no_hide:1,layout_name:dwindle
tagrule=id:4,monitor_name:DP-1,no_hide:1,layout_name:dwindle
tagrule=id:5,monitor_name:DP-1,no_hide:1,layout_name:dwindle
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:dwindle
tagrule=id:10,layout_name:dwindle

