# Autostart (mirrors hypr configs/autostart.lua)
# jhqs is a symlink to quickshell (~/.local/bin/jhqs -> /usr/bin/quickshell).
# -n/--no-duplicate: don't stack a second shell on config reload.
# NOTE: keep this portable (~, not /home/<user>) so fresh installs work.
exec-once=jhqs start
# Wallpaper restore (same source as hypr autostart + jhqs guard).
# jhqs also re-spawns swaybg itself if it dies, so this is just first-paint.
exec-once=bash ~/.config/mango/wallpaper-restore.sh
