# Layer rules (rofi zoom animation).

# About terminal: floating, size comes from kitty (-o initial_window_width=113c -o initial_window_height=29c).
windowrule=isfloating:1,width:1100,height:650,appid:about-fastfetch
# Shell update terminal: untitled (floating), same size/center as the About window.
windowrule=isfloating:1,width:900,height:600,appid:jhqs-shell-update
